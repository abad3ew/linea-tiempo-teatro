<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examen universitario de teatro · 30 preguntas</title><style>body{margin:0;background:#edf2fa;color:#17243c;font:17px system-ui}.box{max-width:790px;margin:30px auto;background:white;padding:25px;border-radius:22px;box-shadow:0 7px 25px #15243b16}button{font:inherit;cursor:pointer;border:1px solid #b9c7de;border-radius:12px;padding:13px;background:white;color:#17243c}.opt{display:block;width:100%;text-align:left;margin:10px 0}.sel{background:#dbeafe;border-color:#2563eb}nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.primary{background:#2459c6;color:white;border:0}.review{border-top:1px solid #d9e0ed;padding:15px 0}.good{color:#167343}.bad{color:#b12c37}.bar{background:#dbe4f4;border-radius:9px;height:8px}.fill{background:#2459c6;height:8px;border-radius:9px}small{color:#56657a}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:650px){.box{margin:8px;padding:18px;border-radius:14px}}</style><main class="box"><h1>Examen universitario de Teatro</h1><p>30 preguntas de aplicación y análisis · Cuatro alternativas · Nota sobre 20. Al finalizar podrás revisar las respuestas y explicaciones.</p><div id="app"></div></main><script>const Q=[
['Una directora mantiene los diálogos pero cambia desplazamientos, iluminación y objetos. ¿Qué intervención realiza?',['Modifica necesariamente la dramaturgia','Desarrolla una propuesta de puesta en escena','Sustituye parlamentos por acotaciones','Elimina la función del guion'],1,'La puesta en escena concreta la dramaturgia mediante decisiones interpretativas y técnicas.'],
['En el guion aparece «Elena mira la puerta» y luego «ELENA: ¿Quién está ahí?». ¿Qué clasificación corresponde?',['Ambos son parlamentos','Primero didascalia; después parlamento','Primero parlamento; después didascalia','Ambos son didascalias'],1,'La indicación de acción es didascalia; las palabras del personaje son parlamento.'],
['Una plataforma vacía representa una prisión gracias a la actuación y la disposición simbólica del espacio. ¿Qué se demuestra?',['Sin decorados realistas no hay escenario','El escenario puede construir significado sin reproducir un lugar real','La escenografía requiere paredes físicas','La obra se convierte en lectura dramatizada'],1,'El escenario puede funcionar como espacio físico y simbólico.'],
['Un personaje quiere revelar un secreto, teme perder a su familia y recibe presión para hablar. ¿Dónde reside el conflicto?',['Solo en quien lo presiona','En el objetivo y los obstáculos internos y externos','Solo en el objeto secreto','Exclusivamente en el desenlace'],1,'El conflicto combina el objetivo con las fuerzas que impiden alcanzarlo.'],
['La protagonista descubre una traición y toma una decisión irreversible. ¿Qué permite reconocer el clímax?',['El número de actores','La máxima intensidad decisiva del conflicto','Ser siempre la última escena','Revelar cualquier antecedente'],1,'El clímax es un punto de máxima tensión y cambio en el conflicto.'],
['Un personaje impide que la protagonista viaje porque cree que la protege. ¿Por qué puede ser antagonista?',['No puede serlo si pretende protegerla','Su objetivo se opone al de ella','Debe actuar con maldad deliberada','Los objetivos distintos eliminan el conflicto'],1,'La función antagónica depende de la oposición dramática, no de la maldad.'],
['El director busca coherencia entre actuación, iluminación y vestuario. ¿Qué función desempeña?',['Reemplazar el texto','Coordinar la interpretación y los elementos técnicos','Eliminar toda autonomía creativa','Transformar acotaciones en parlamentos'],1,'La dirección integra el trabajo artístico y técnico en una puesta en escena.'],
['¿Qué transición explica el surgimiento de las primeras representaciones estudiadas?',['Del teatro al mito sin ritos','Del mito al rito y a la escenificación teatral','De Roma a Grecia','Del teatro contemporáneo al ritual'],1,'El curso presenta el tránsito del mito al rito y de la escenificación ritual al teatro.'],
['Un intérprete se separa de la actuación coral y dialoga con el coro. ¿Con quién se relaciona?',['Tespis','Molière','Brecht','Shakespeare'],0,'Tespis se vincula con el diálogo entre intérprete y coro en el teatro griego.'],
['¿Cómo debe corregirse una cronología que sitúa el Renacimiento antes de la Edad Media?',['Mantener el orden','Colocar el Renacimiento después del teatro medieval','Situar Roma después del Renacimiento','Colocar Grecia después de la Edad Media'],1,'La secuencia estudiada es Grecia, Roma, Edad Media y Renacimiento.'],
['Una representación medieval dramatiza episodios bíblicos para una comunidad. ¿Qué conclusión es adecuada?',['Todas las obras medievales eran idénticas','La relación con contenidos religiosos fue importante','El contenido religioso surgió solo en el Renacimiento','Lo religioso impide la representación teatral'],1,'El contexto religioso fue relevante para el teatro medieval, sin agotar todas sus manifestaciones.'],
['Una actriz memoriza el texto, pero ignora los cambios de intención de su compañero. ¿Qué debe fortalecer?',['La memorización','La escucha y reacción escénica','La repetición idéntica de gestos','La proyección sin variación'],1,'Escuchar permite responder a lo que ocurre en escena y sostener la actuación colaborativa.'],
['¿Qué objeción corresponde a quien afirma que basta con dominar uno de los instrumentos actorales?',['La voz reemplaza al cuerpo','Cuerpo, voz y mente deben integrarse','La mente solo sirve para memorizar','El cuerpo solo se usa sin diálogos'],1,'La interpretación integra los instrumentos corporales, vocales y mentales.'],
['Un actor investiga los temores y antecedentes de su personaje. ¿Para qué?',['Comprender motivaciones y orientar acciones','Reemplazar los objetivos por biografía','Fijar una sola emoción para toda la obra','Impedir su evolución'],0,'La historia personal ayuda a comprender las motivaciones del personaje.'],
['Un actor afirma que el «como si» consiste en copiar gestos observados. ¿Qué falta?',['Rechazar toda observación','Actuar desde las circunstancias imaginadas y su lógica','Repetir siempre la misma emoción','Ignorar los objetivos'],1,'El «como si» implica considerar verdaderas las circunstancias ficticias, no solo imitar.'],
['Dos funciones conservan texto y reparto, pero cambian pequeños ritmos y reacciones. ¿Por qué?',['No hubo preparación','Cada representación en vivo es irrepetible','No existe estructura dramática','Todo el texto debe improvisarse'],1,'La naturaleza en vivo hace que cada función tenga circunstancias propias.'],
['Un actor invade la distancia de otro; este gira el torso y aprieta los puños. ¿Qué análisis es correcto?',['Distancia: kinesia; giro: proxemia; tensión: entonación','Distancia: proxemia; giro: kinesia; tensión: tono muscular','Distancia: tono muscular; giro: ritmo; puños: didascalia','Todo corresponde exclusivamente a proxemia'],1,'La proxemia aborda distancias; la kinesia, movimientos; el tono muscular, tensión.'],
['Una actriz mantiene hombros rígidos y pierde equilibrio al desplazarse. ¿Qué trabajo requiere?',['Más volumen y rapidez','Tono muscular, eje y alineación','Solo dicción y entonación','Acercarse al público'],1,'Regular la tensión y trabajar alineación favorece equilibrio y movimiento.'],
['Un actor muestra temor sin palabras cambiando postura y desplazamientos. ¿Qué lo hace comprensible?',['La expresión corporal comunica estados sin lenguaje verbal','Toda emoción exige parlamento','El movimiento solo indica ubicación','La postura solo expresa rasgos permanentes'],0,'El cuerpo transmite emociones y significados mediante posturas, gestos y movimiento.'],
['Una actriz pronuncia claramente y tiene alcance, pero interpreta pregunta y acusación con idéntica melodía. ¿Qué debe trabajar?',['Articulación','Proyección','Entonación','Volumen'],2,'La entonación modifica la melodía y el sentido expresivo de la frase.'],
['Un actor varía entre grave y agudo, pero conserva siempre la misma intensidad. ¿Qué diferencia importa?',['Tono y volumen son idénticos','Tono es altura; volumen es intensidad','Volumen es velocidad; tono son pausas','Tono depende solo de distancia'],1,'La altura vocal es el tono; la intensidad sonora es el volumen.'],
['Una intérprete acelera el texto y elimina pausas; el público pierde información. ¿Qué conviene?',['Solo subir el volumen','Regular ritmo y pausas conservando intención','Elevar el tono de todas las palabras','Reducir la articulación'],1,'El ritmo incluye velocidad, cadencia y pausas, fundamentales para la comprensión.'],
['Un actor intenta alcanzar el fondo de la sala forzando la garganta. ¿Qué corrección corresponde?',['Gritar al máximo','Coordinar aire, postura y resonancia para proyectar','Hablar siempre agudo','Eliminar las pausas respiratorias'],1,'Proyectar no es gritar: requiere coordinación respiratoria y corporal.'],
['Una actriz libera el aire de golpe y no sostiene el final de una frase. ¿Qué debe entrenar?',['Exhalación controlada','Proxemia','Caracterización social','Memoria emocional'],0,'Controlar el flujo de aire ayuda a sostener frases y la emisión vocal.'],
['La voz llega al fondo de la sala, pero el público confunde consonantes. ¿Qué diagnóstico corresponde?',['Falta alcance','La articulación necesita precisión aunque exista proyección','La entonación es necesariamente incorrecta','Solo falla el ritmo'],1,'La proyección garantiza alcance; la articulación favorece claridad de los sonidos.'],
['Una actriz ejercita labios, lengua y mandíbula sin subir el volumen. ¿Qué entrena?',['Articulación','Distancia escénica','Dramaturgia','Conflicto'],0,'Estos órganos participan en la formación precisa de los sonidos.'],
['Un actor acepta que apareció una carta comprometedora, pero cambia de asunto sin relación. ¿Qué ocurre?',['Niega desde el inicio','Acepta la propuesta, pero abandona la continuidad','Mantiene el argumento correctamente','Debe abandonar cada idea aceptada'],1,'La improvisación requiere aceptar propuestas y desarrollarlas con coherencia.'],
['Un grupo improvisa cambiando continuamente de lugar y situación; el público no comprende. ¿Qué debe precisar?',['Solo vestuario','Argumento, espacio y situación','Solo intensidad vocal','Texto memorizado íntegramente'],1,'Estos elementos orientan la improvisación y sostienen su estructura narrativa.'],
['Se anotan estatura, timbre de voz, ocupación y miedo al abandono. ¿Cómo se clasifican?',['Estatura social; timbre espiritual; ocupación física; miedo psicológico','Estatura y timbre físicos; ocupación social; miedo psicológico','Estatura psicológica; timbre social; ocupación espiritual; miedo físico','Todos son físicos'],1,'El análisis del personaje distingue rasgos físicos, contexto social y mundo psicológico.'],
['Un personaje pertenece a una familia influyente, desea reconocimiento, teme decepcionar y se guía por creencias. ¿Qué clasificación corresponde?',['Familia social; deseo y temor psicológicos; creencias espirituales','Familia física; deseo social; temor espiritual; creencias psicológicas','Familia y creencias físicas; deseo y temor sociales','Todos exclusivamente psicológicos'],0,'El análisis cuatridimensional separa entorno social, motivaciones psicológicas y creencias espirituales.']
];let A=Array(30).fill(null),n=0,done=false;const app=document.getElementById('app');function render(){if(done){let s=A.filter((a,i)=>a===Q[i][3]).length;app.innerHTML=`<h2>Resultado: ${s}/30 · Nota ${(s*20/30).toFixed(2)}/20</h2><p>Correctas: ${s} · Incorrectas o sin responder: ${30-s}. Revisa la clave y las explicaciones:</p>`+Q.map((q,i)=>`<section class="review"><b>${i+1}. ${q[0]}</b><p class="${A[i]===q[3]?'good':'bad'}">Tu respuesta: ${A[i]===null?'Sin responder':String.fromCharCode(65+A[i])+'. '+q[1][A[i]]} ${A[i]===q[3]?'✓':'✗'}</p><p><b>Correcta: ${String.fromCharCode(65+q[3])}.</b> ${q[1][q[3]]}</p><p><b>Explicación:</b> ${q[4]}</p></section>`).join('')+'<button class="primary" onclick="A.fill(null);n=0;done=false;render();scrollTo(0,0)">Repetir examen</button>';return}let q=Q[n];app.innerHTML=`<small>Pregunta ${n+1} de 30 · Respondidas ${A.filter(x=>x!==null).length}</small><div class="bar"><div class="fill" style="width:${(n+1)/30*100}%"></div></div><h2>${n+1}. ${q[0]}</h2>`+q[1].map((o,i)=>`<button class="opt ${A[n]===i?'sel':''}" onclick="A[n]=${i};render()">${'ABCD'[i]}. ${o}</button>`).join('')+`<nav><button ${n===0?'disabled':''} onclick="n--;render()">Anterior</button>${n===29?'<button class="primary" onclick="if(A.includes(null)&&!confirm(\'Hay preguntas sin responder. ¿Deseas finalizar?\'))return;done=true;render();scrollTo(0,0)">Finalizar y corregir</button>':'<button class="primary" onclick="n++;render()">Siguiente</button>'}</nav>`}render();</script></html>
