<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070708"><title>DEL AIRE A LA VOZ · IMST + SOVTE</title><style>:root{--b:#070708;--r:#a51229;--r2:#e32d43;--g:#d2aa58;--w:#f6f3ed;--m:#b6b3ad}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y mandatory}body{margin:0;background:var(--b);color:var(--w);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 72% 18%,#a5122926,transparent 27%),radial-gradient(circle at 18% 80%,#d2aa5810,transparent 25%);pointer-events:none;z-index:-1}.slide{min-height:100svh;scroll-snap-align:start;display:grid;place-items:center;position:relative;padding:70px 8vw;overflow:hidden;border-bottom:1px solid #222228}.slide:first-child{background:radial-gradient(circle at 75% 50%,#9e142a22,transparent 30%),linear-gradient(110deg,#050506 0%,#0b0a0c 55%,#210911 100%)}.kicker{position:absolute;top:24px;left:8vw;right:8vw;display:flex;justify-content:space-between;color:var(--g);font-size:.7rem;font-weight:800;letter-spacing:.18em}.inner{width:min(1280px,100%);display:grid;grid-template-columns:1.1fr .75fr;gap:6vw;align-items:center}.eyebrow{color:var(--g);font-size:.68rem;font-weight:800;letter-spacing:.18em;margin-bottom:18px}h1{font:800 clamp(3rem,6.4vw,7rem)/.91 Georgia,serif;letter-spacing:-.045em;margin:0;max-width:950px}.line{width:180px;height:4px;margin:28px 0;background:linear-gradient(90deg,var(--r2),var(--g));border-radius:10px}ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}li{padding:13px 16px;border-left:3px solid var(--r2);background:linear-gradient(90deg,#fff8,transparent);border-radius:0 10px 10px 0;color:var(--m);font-size:clamp(.95rem,1.3vw,1.18rem);line-height:1.4}li:first-child{color:var(--w)}.visual{display:grid;place-items:center}.scene{width:min(440px,70vw);aspect-ratio:1;border-radius:34px;border:1px solid #d2aa5840;position:relative;background:radial-gradient(circle at 50% 45%,#a5122925,transparent 38%),linear-gradient(145deg,#17171b,#08080a);box-shadow:0 30px 100px #0009,inset 0 0 70px #a5122910;overflow:hidden}.stage{position:absolute;left:8%;right:8%;bottom:11%;height:17%;border-top:2px solid #d2aa5845;transform:perspective(300px) rotateX(52deg)}.actor{position:absolute;left:42%;top:23%;width:17%;height:57%;filter:drop-shadow(0 0 16px #e32d4340)}.head{width:34%;aspect-ratio:1;border-radius:50%;background:#ddd2c4;margin:auto}.body{position:absolute;left:21%;top:18%;width:58%;height:48%;border-radius:45% 45% 22% 22%;background:linear-gradient(90deg,#651321,#c02b3e,#5b101d)}.leg{position:absolute;top:60%;width:22%;height:39%;background:#19191c;border-radius:20px}.leg.l{left:22%;transform:rotate(5deg)}.leg.r{right:22%;transform:rotate(-5deg)}.lungs{position:absolute;left:32%;top:35%;width:36%;height:27%;opacity:.72}.lung{position:absolute;width:45%;height:82%;background:#dfe0da18;border:2px solid #e32d4377;border-radius:48% 48% 44% 44%;box-shadow:0 0 18px #e32d4325}.lung.l{left:0}.lung.r{right:0}.trachea{position:absolute;left:46%;top:-15%;width:8%;height:35%;border-left:3px solid var(--g);border-right:3px solid var(--g);border-radius:50%}.air{position:absolute;left:18%;right:18%;top:51%;height:2px;background:linear-gradient(90deg,transparent,var(--g),var(--r2),transparent);box-shadow:0 0 12px var(--g);animation:air 2.4s linear infinite}.wave{position:absolute;left:12%;right:12%;top:67%;height:48px;border-top:2px solid var(--r2);border-radius:50%;filter:drop-shadow(0 0 7px #e32d4355)}.scene-label{position:absolute;left:26px;bottom:25px;color:var(--g);font-size:.72rem;letter-spacing:.18em;font-weight:800}.scene-num{position:absolute;right:24px;top:20px;color:var(--r2);font:800 4rem Georgia}.scene:before,.scene:after{content:"";position:absolute;border:1px solid #6ca9b933;border-radius:50%;inset:14%;animation:spin 18s linear infinite}.scene:after{inset:24%;border-color:#d2aa5830;animation-duration:12s;animation-direction:reverse}.controls{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;gap:8px}.controls button,.full{border:1px solid #45454b;background:#101013dd;color:#eee;border-radius:999px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(12px)}.full{position:fixed;right:20px;top:18px;z-index:20;border-radius:10px}.side{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:5px;max-height:72vh;overflow:auto}.side button{width:31px;height:25px;background:#101013;color:#777;border:1px solid #39393e;border-radius:5px;font-size:9px;cursor:pointer}.side button:hover,.side button.active{background:var(--r);color:#fff;border-color:var(--r2)}.progress{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--r2),var(--g));z-index:50}@keyframes spin{to{transform:rotate(360deg)}}@keyframes air{0%{transform:scaleX(.2);opacity:0}25%,75%{opacity:1}100%{transform:scaleX(1);opacity:0}}@media(max-width:850px){html{scroll-snap-type:none}.slide{padding:80px 9vw 45px}.inner{grid-template-columns:1fr}.visual{order:-1}.scene{width:270px}h1{font-size:clamp(2.8rem,13vw,5rem)}.side{display:none}.full{display:none}}</style></head><body><div class="progress" id="progress"></div><button class="full" onclick="full()">⛶ Pantalla completa</button><nav class="side" id="nav"></nav><div class="controls"><button onclick="go(cur-1)">←</button><button onclick="go(cur+1)">→</button></div><main id="app"></main><script>const D=[['PORTADA','DEL AIRE A LA VOZ',['Entrenamiento de la musculatura respiratoria y ejercicios de tracto vocal semiocluido (SOVTE) en el actor.','Psicología · Teatro · Experiencia académica']],['PREGUNTA INICIAL','¿Puede entrenarse la respiración para mejorar el uso de la voz del actor?',['La pregunta guía toda la exposición.','No buscamos “más aire”: buscamos comprender cómo se produce, regula y utiliza el flujo respiratorio durante la acción vocal.']],['CONTEXTO ESCÉNICO','¿Por qué importa la respiración?',['Habla: frases, pausas y articulación.','Movimiento: desplazamiento, gesto y esfuerzo.','Emoción: ritmo, intensidad y tensión.','Demandas escénicas: espacio, ruido, duración y proyección.']],['ANATOMÍA','La musculatura inspiratoria',['Los pulmones no son músculos.','El diafragma es el principal músculo inspiratorio.','Los intercostales externos contribuyen a la expansión de la caja torácica.','Otros músculos pueden participar cuando aumenta la demanda respiratoria.']],['MECÁNICA','Del movimiento respiratorio al flujo',['Inspiración → expansión torácica → cambios de presión → flujo de aire.','El actor coordina respiración, postura, movimiento y emisión según la tarea.','Respirar profundamente no equivale, por sí solo, a realizar IMST.']],['IMST','¿Qué es el IMST?',['Inspiratory Muscle Strength Training.','Entrenamiento de la musculatura inspiratoria contra una resistencia graduable.','Se diferencia de una respiración profunda libre porque incorpora carga, dosis y progresión.','Herramienta típica: dispositivo de entrenamiento inspiratorio.']],['HERRAMIENTAS','Materiales para IMST',['Dispositivo inspiratorio con resistencia ajustable.','Boquilla individual o higienizada.','Registro de carga y repeticiones.','Cronómetro y hoja de observación.','La carga individual debe establecerse con criterio profesional; esta presentación no prescribe dosis.']],['EVIDENCIA','¿Qué demuestra la evidencia?',['El IMST puede aumentar la fuerza de la musculatura inspiratoria en distintas poblaciones y protocolos.','La transferencia directa a la voz escénica del actor es una cuestión diferente.','No debe afirmarse automáticamente que IMST produce “más potencia vocal” en todos los actores.']],['TRANSICIÓN','RESPIRACIÓN → CONTROL → FONACIÓN → VOZ',['El aire no es la voz.','El flujo respiratorio participa en la fuente de energía de la fonación.','La producción vocal depende de la coordinación de respiración, vibración laríngea y configuración del tracto vocal.']],['SOVTE','¿Qué son los SOVTE?',['Semi-Occluded Vocal Tract Exercises.','Ejercicios donde el tracto vocal permanece parcialmente estrechado durante la fonación.','Ejemplos: vibración de labios, humming y fonación con pajilla.','Se utilizan como herramientas de entrenamiento o calentamiento vocal.']],['HERRAMIENTAS','Kit mínimo para SOVTE',['Vibración de labios: sin material.','Humming: sin material.','Pajilla al aire: pajilla limpia.','Pajilla con agua: vaso + pajilla, usando una ejecución cómoda y controlada.','Celular/cámara: opcional para registro educativo.']],['PRÁCTICA','Tres ejercicios para demostrar',['01 · Vibración de labios: “brrr”.','02 · Humming: “mmm”.','03 · Pajilla: fonación suave a través del tubo.','Prioridad: comodidad, coordinación y observación; no competir por volumen o potencia.']],['EVIDENCIA DIRECTA','El estudio con 27 actores profesionales',['Di Natale et al. (2022) estudiaron 27 actores profesionales.','Tras un calentamiento SOVTE de 10 minutos se observaron mejoras principalmente en la autopercepción de comodidad, sonoridad, claridad y potencia.','No todas las medidas objetivas mostraron cambios estadísticamente significativos.']],['LECTURA CRÍTICA','¿Qué podemos decir?',['SÍ: existe evidencia directa en esos 27 actores sobre mejoras de autopercepción tras el protocolo estudiado.','NO: no se puede convertir ese resultado en una promesa de mejora objetiva permanente.','NO: tampoco se debe generalizar automáticamente a todos los actores, estilos o dosis.']],['COMPARACIÓN','IMST vs SOVTE',['IMST → musculatura inspiratoria · carga y resistencia.','SOVTE → configuración del tracto vocal durante la fonación.','IMST: evidencia fuerte para fuerza inspiratoria en varias poblaciones; evidencia específica en actores limitada.','SOVTE: literatura vocal amplia, pero la evidencia depende de población, protocolo y resultado medido.']],['DEMOSTRACIÓN','Mini-práctica segura',['Postura estable y cuello/mandíbula cómodos.','Inspiración tranquila, sin forzar.','30–60 s de humming o vibración de labios.','Decir una frase breve y comparar la sensación.','Detener ante dolor, mareo, falta de aire inusual o esfuerzo excesivo.']],['INTEGRACIÓN','Del músculo a la escena',['Musculatura respiratoria → control del aire → fonación → SOVTE → voz escénica.','Ningún ejercicio aislado explica toda la voz del actor.','La aplicación debe responder a una tarea vocal concreta.']],['CONCLUSIÓN','Tres ideas para llevarse',['1. Los pulmones no se “fortalecen”: se entrena la musculatura respiratoria.','2. Los SOVTE son herramientas vocales, no una garantía automática de mejora.','3. La evidencia debe interpretarse según población, protocolo y tipo de resultado.']],['REFERENCIAS','APA 7 · fuentes principales',['Di Natale, V., Cantarella, G., Manfredi, C., Ciabatta, A., Bacherini, C., & DeJonckere, P. H. (2022). Semioccluded Vocal Tract Exercises Improve Self-Perceived Voice Quality in Healthy Actors. Journal of Voice, 36(4), 584.e7–584.e14.','Enright, S. J., & Unnithan, V. B. (2011). Effect of inspiratory muscle training intensities on pulmonary function and work capacity in people who are healthy: A randomized controlled trial. Physical Therapy, 91(6), 894–905.','HajGhanbari, B., et al. (2013). Effects of respiratory muscle training on performance in athletes: A systematic review with meta-analyses. Journal of Strength and Conditioning Research, 27(6), 1643–1663.','Pozzali, I., et al. (2024). Effectiveness of Semi-Occluded Vocal Tract Exercises (SOVTEs) in Patients with Dysphonia: A Systematic Review and Meta-Analysis. Journal of Voice, 38(1), 245.e17–245.e35.']]];const app=document.getElementById('app'),nav=document.getElementById('nav');D.forEach((d,i)=>{let s=document.createElement('section');s.className='slide';s.id='s'+i;s.innerHTML='<div class="kicker"><span>'+d[0]+'</span><b>'+String(i+1).padStart(2,'0')+'</b></div><div class="inner"><div class="copy"><div class="eyebrow">DEL AIRE A LA VOZ · EXPERIENCIA ACADÉMICA</div><h1>'+d[1]+'</h1><div class="line"></div><ul>'+d[2].map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="visual"><div class="scene"><div class="scene-num">'+String(i+1).padStart(2,'0')+'</div><div class="lungs"><div class="trachea"></div><div class="lung l"></div><div class="lung r"></div></div><div class="actor"><div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div></div><div class="air"></div><div class="wave"></div><div class="stage"></div><div class="scene-label">'+d[0]+'</div></div></div></div>';app.appendChild(s);let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.onclick=()=>go(i);nav.appendChild(b)});let cur=0,ss=[...document.querySelectorAll('.slide')];function go(n){cur=Math.max(0,Math.min(ss.length-1,n));ss[cur].scrollIntoView({behavior:'smooth'});upd()}function upd(){document.getElementById('progress').style.width=cur/(ss.length-1)*100+'%';[...nav.children].forEach((b,i)=>b.classList.toggle('active',i===cur))}onkeydown=e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}};const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cur=ss.indexOf(e.target);upd()}}),{threshold:.6});ss.forEach(s=>io.observe(s));function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}upd();</script></body></html>
