<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEL AIRE A LA VOZ · IMST + SOVTE</title><meta name="description" content="Presentación académica interactiva sobre musculatura respiratoria, IMST y SOVTE en el actor."><style>:root{--bg:#070708;--red:#a51229;--red2:#e32d43;--gold:#d2aa58;--white:#f6f3ed;--muted:#b6b3ad}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y mandatory}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 75% 20%,#8b17261c,transparent 28%),radial-gradient(circle at 20% 75%,#d2aa5810,transparent 26%);z-index:-1}.slide{min-height:100svh;scroll-snap-align:start;position:relative;padding:6vh 8vw;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid #222228}.slide:first-of-type{background:linear-gradient(90deg,#050506b5,#050506d9),url("https://raw.githubusercontent.com/abad3ew/linea-tiempo-teatro/main/del-aire-a-la-voz/portada.png") center/cover}.inner{width:min(1280px,100%);display:grid;grid-template-columns:1.1fr .7fr;gap:7vw;align-items:center}.kicker{position:absolute;top:24px;left:8vw;right:8vw;display:flex;justify-content:space-between;color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.18em}.eyebrow{color:var(--gold);font-size:.7rem;letter-spacing:.18em;font-weight:800;margin-bottom:18px}h1{font:800 clamp(3rem,6.5vw,7rem)/.91 Georgia,serif;letter-spacing:-.045em;margin:0;max-width:900px}.line{height:4px;width:180px;margin:28px 0;background:linear-gradient(90deg,var(--red2),var(--gold));border-radius:9px}ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}li{padding:13px 16px;border-left:3px solid var(--red2);background:linear-gradient(90deg,#ffffff09,transparent);border-radius:0 10px 10px 0;color:var(--muted);line-height:1.38;font-size:clamp(.95rem,1.35vw,1.2rem)}li:first-child{color:var(--white)}.visual{display:grid;place-items:center}.orb{width:min(390px,65vw);aspect-ratio:1;border-radius:50%;border:1px solid #c49e4d55;position:relative;background:radial-gradient(circle,#a5122920,transparent 52%),#0c0c0f;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 90px #a5122918,inset 0 0 70px #ffffff05}.orb:before,.orb:after{content:"";position:absolute;border:1px solid #6ca9b933;border-radius:50%;inset:16%;animation:spin 16s linear infinite}.orb:after{inset:27%;border-color:#e32d4355;animation-duration:9s;animation-direction:reverse}.orb strong{font:800 5rem Georgia;color:var(--red2);z-index:1}.orb span{text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-size:.75rem;font-weight:800;z-index:1}.orb i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--red2);box-shadow:0 0 24px var(--red2);animation:pulse 2s infinite}.controls{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;gap:8px}.controls button,.full{background:#101013dd;color:#eee;border:1px solid #45454b;border-radius:999px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(12px)}.controls button:hover,.full:hover{border-color:var(--gold);color:var(--gold)}.full{position:fixed;right:20px;top:18px;z-index:20;border-radius:10px}.side{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:5px;max-height:70vh;overflow:auto;padding:6px}.side button{width:31px;height:25px;background:#101013;color:#777;border:1px solid #39393e;border-radius:5px;font-size:9px;cursor:pointer}.side button:hover{background:var(--red);color:#fff;border-color:var(--red2)}.progress{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--red2),var(--gold));width:0;z-index:50}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.7);opacity:.6}}@media(max-width:850px){html{scroll-snap-type:none}.slide{padding:80px 9vw 45px;min-height:100svh}.inner{grid-template-columns:1fr}.visual{order:-1}.orb{width:240px}.side{display:none}h1{font-size:clamp(2.8rem,13vw,5rem)}.full{display:none}}</style></head><body><div class="progress" id="p"></div><button class="full" onclick="full()">⛶ Pantalla completa</button><nav class="side" id="nav"></nav><div class="controls"><button onclick="go(cur-1)">←</button><button onclick="go(cur+1)">→</button></div><main id="app"></main><script>const data=[['PORTADA','DEL AIRE A LA VOZ',['Entrenamiento de la musculatura respiratoria y ejercicios de tracto vocal semiocluido (SOVTE) en el actor.','Psicología · Teatro · Experiencia académica']],['PREGUNTA INICIAL','¿Puede entrenarse la respiración para mejorar el uso de la voz del actor?',['La pregunta guía toda la exposición.','No buscamos “más aire”: buscamos comprender cómo se produce, regula y utiliza el flujo respiratorio durante la acción vocal.']],['CONTEXTO ESCÉNICO','¿Por qué importa la respiración?',['Habla: frases, pausas y articulación.','Movimiento: desplazamiento, gesto y esfuerzo.','Emoción: ritmo, intensidad y tensión.','Demandas escénicas: espacio, ruido, duración y proyección.']],['ANATOMÍA','La musculatura inspiratoria',['Los pulmones no son músculos.','El diafragma es el principal músculo inspiratorio.','Los intercostales externos contribuyen a la expansión de la caja torácica.','Otros músculos pueden participar cuando aumenta la demanda respiratoria.']],['MECÁNICA','Del movimiento respiratorio al flujo',['Inspiración → expansión torácica → cambios de presión → flujo de aire.','El actor coordina respiración, postura, movimiento y emisión según la tarea.','Respirar profundamente no equivale, por sí solo, a realizar IMST.']],['IMST','¿Qué es el IMST?',['Inspiratory Muscle Strength Training.','Entrenamiento de la musculatura inspiratoria contra una resistencia graduable.','Se diferencia de una respiración profunda libre porque incorpora carga, dosis y progresión.','Herramienta típica: dispositivo de entrenamiento inspiratorio.']],['HERRAMIENTAS','Materiales para IMST',['Dispositivo inspiratorio con resistencia ajustable.','Boquilla individual o higienizada.','Registro de carga y repeticiones.','Cronómetro y hoja de observación.','La carga individual debe establecerse con criterio profesional; esta presentación no prescribe dosis.']],['EVIDENCIA','¿Qué demuestra la evidencia?',['El IMST puede aumentar la fuerza de la musculatura inspiratoria en distintas poblaciones y protocolos.','La transferencia directa a la voz escénica del actor es una cuestión diferente.','No debe afirmarse automáticamente que IMST produce “más potencia vocal” en todos los actores.']],['TRANSICIÓN','RESPIRACIÓN → CONTROL → FONACIÓN → VOZ',['El aire no es la voz.','El flujo respiratorio participa en la fuente de energía de la fonación.','La producción vocal depende de la coordinación de respiración, vibración laríngea y configuración del tracto vocal.']],['SOVTE','¿Qué son los SOVTE?',['Semi-Occluded Vocal Tract Exercises.','Ejercicios donde el tracto vocal permanece parcialmente estrechado durante la fonación.','Ejemplos: vibración de labios, humming y fonación con pajilla.','Se utilizan como herramientas de entrenamiento o calentamiento vocal.']],['HERRAMIENTAS','Kit mínimo para SOVTE',['Vibración de labios: sin material.','Humming: sin material.','Pajilla al aire: pajilla limpia.','Pajilla con agua: vaso + pajilla, usando una ejecución cómoda y controlada.','Celular/cámara: opcional para registro educativo.']],['PRÁCTICA','Tres ejercicios para demostrar',['01 · Vibración de labios: “brrr”.','02 · Humming: “mmm”.','03 · Pajilla: fonación suave a través del tubo.','Prioridad: comodidad, coordinación y observación; no competir por volumen o potencia.']],['EVIDENCIA DIRECTA','El estudio con 27 actores profesionales',['Di Natale et al. (2022) estudiaron 27 actores profesionales.','Tras un calentamiento SOVTE de 10 minutos se observaron mejoras principalmente en la autopercepción de comodidad, sonoridad, claridad y potencia.','No todas las medidas objetivas mostraron cambios estadísticamente significativos.']],['LECTURA CRÍTICA','¿Qué podemos decir?',['SÍ: existe evidencia directa en esos 27 actores sobre mejoras de autopercepción tras el protocolo estudiado.','NO: no se puede convertir ese resultado en una promesa de mejora objetiva permanente.','NO: tampoco se debe generalizar automáticamente a todos los actores, estilos o dosis.']],['COMPARACIÓN','IMST vs SOVTE',['IMST → musculatura inspiratoria · carga y resistencia.','SOVTE → configuración del tracto vocal durante la fonación.','IMST: evidencia fuerte para fuerza inspiratoria en varias poblaciones; evidencia específica en actores limitada.','SOVTE: literatura vocal amplia, pero la evidencia depende de población, protocolo y resultado medido.']],['DEMOSTRACIÓN','Mini-práctica segura',['Postura estable y cuello/mandíbula cómodos.','Inspiración tranquila, sin forzar.','30–60 s de humming o vibración de labios.','Decir una frase breve y comparar la sensación.','Detener ante dolor, mareo, falta de aire inusual o esfuerzo excesivo.']],['INTEGRACIÓN','Del músculo a la escena',['Musculatura respiratoria → control del aire → fonación → SOVTE → voz escénica.','Ningún ejercicio aislado explica toda la voz del actor.','La aplicación debe responder a una tarea vocal concreta.']],['CONCLUSIÓN','Tres ideas para llevarse',['1. Los pulmones no se “fortalecen”: se entrena la musculatura respiratoria.','2. Los SOVTE son herramientas vocales, no una garantía automática de mejora.','3. La evidencia debe interpretarse según población, protocolo y tipo de resultado.']],['REFERENCIAS','APA 7 · fuentes principales',['Di Natale, V., Cantarella, G., Manfredi, C., Ciabatta, A., Bacherini, C., & DeJonckere, P. H. (2022). Semioccluded Vocal Tract Exercises Improve Self-Perceived Voice Quality in Healthy Actors. Journal of Voice, 36(4), 584.e7–584.e14.','Enright, S. J., & Unnithan, V. B. (2011). Effect of inspiratory muscle training intensities on pulmonary function and work capacity in people who are healthy: A randomized controlled trial. Physical Therapy, 91(6), 894–905.','HajGhanbari, B., et al. (2013). Effects of respiratory muscle training on performance in athletes: A systematic review with meta-analyses. Journal of Strength and Conditioning Research, 27(6), 1643–1663.','Pozzali, I., et al. (2024). Effectiveness of Semi-Occluded Vocal Tract Exercises (SOVTEs) in Patients with Dysphonia: A Systematic Review and Meta-Analysis. Journal of Voice, 38(1), 245.e17–245.e35.']]];const app=document.getElementById('app'),nav=document.getElementById('nav');data.forEach((d,i)=>{const s=document.createElement('section');s.className='slide';s.id='s'+i;s.innerHTML='<div class="kicker"><span>'+d[0]+'</span><b>'+String(i+1).padStart(2,'0')+'</b></div><div class="inner"><div class="copy"><div class="eyebrow">DEL AIRE A LA VOZ · EXPERIENCIA ACADÉMICA</div><h1>'+d[1]+'</h1><div class="line"></div><ul>'+d[2].map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="visual"><div class="orb"><strong>'+String(i+1).padStart(2,'0')+'</strong><span>'+d[0]+'</span><i></i></div></div></div>';app.appendChild(s);const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.onclick=()=>go(i);nav.appendChild(b)});let cur=0;const ss=[...document.querySelectorAll('.slide')];function go(n){cur=Math.max(0,Math.min(ss.length-1,n));ss[cur].scrollIntoView({behavior:'smooth'});upd()}function upd(){document.getElementById('p').style.width=(cur/(ss.length-1)*100)+'%'}window.onkeydown=e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}};const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cur=ss.indexOf(e.target);upd()}}),{threshold:.6});ss.forEach(s=>io.observe(s));function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}upd();</script></body></html>
