<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infografía — Propiedades y funciones del lenguaje</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;font-family:Arial,sans-serif;color:#fff}header{position:sticky;top:0;z-index:10;background:rgba(15,15,18,.96);padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:10px;padding:9px 13px;background:#fff;color:#111;font-weight:700;cursor:pointer}.hint{font-size:12px;opacity:.75}main{min-height:calc(100vh - 58px);display:flex;justify-content:center;align-items:flex-start;padding:18px}.stage{width:min(100%,900px);display:flex;justify-content:center}img{display:block;width:auto;height:auto;max-width:100%;box-shadow:0 10px 35px rgba(0,0,0,.45);transform-origin:top center;transition:transform .18s ease}@media(max-width:600px){main{padding:8px}}</style></head><body><header><button onclick="zoom(1.15)">＋ Zoom</button><button onclick="zoom(.87)">− Zoom</button><button onclick="resetZoom()">Restablecer</button><button onclick="document.documentElement.requestFullscreen?.()">Pantalla completa</button><span class="hint">Infografía íntegra · usa zoom para leer.</span></header><main><div class="stage"><img id="poster" alt="Infografía completa: Propiedades y funciones del lenguaje" src="data:image/webp;base64,BASE64_IMAGE"></div></main><script>let z=1;const p=document.getElementById('poster');function render(){p.style.transform=`scale(${z})`}function zoom(v){z=Math.max(.5,Math.min(4,z*v));render()}function resetZoom(){z=1;render()}document.addEventListener('keydown',e=>{if(e.key==='+')zoom(1.15);if(e.key==='-')zoom(.87);if(e.key==='0')resetZoom()});</script></body></html>
