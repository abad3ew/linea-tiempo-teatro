<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examen de teatro</title><style>body{font:17px system-ui;background:#edf2f9;color:#15233b;margin:0}.wrap{max-width:760px;margin:35px auto;padding:24px;background:white;border-radius:22px;box-shadow:0 8px 30px #1223}button{cursor:pointer;border:1px solid #cad5e6;border-radius:12px;padding:14px;background:white;font:inherit;text-align:left}button:hover{background:#eaf2ff}.option{display:block;width:100%;margin:10px 0}.selected{background:#dceaff;border-color:#245fd3}.bar{height:9px;background:#e6ebf4;border-radius:9px;overflow:hidden}.fill{height:100%;background:#245fd3}nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}nav button,.primary{background:#245fd3;color:white;border:0}small{color:#586779}.review{border-top:1px solid #ddd;padding:15px 0}.wrong{color:#a52b2b}.correct{color:#147342}</style><main class="wrap"><h1>Examen de Teatro</h1><p>50 preguntas de alternativa múltiple. Responde y al finalizar recibirás tu nota, las respuestas correctas y explicaciones de tus errores.</p><div id="app"></div></main><script>const raw=[
['¿Qué caracteriza al teatro como arte?','La actuación en vivo y colaborativa','La edición cinematográfica','La lectura silenciosa','La fotografía','Combina recursos artísticos en una representación en vivo.'],
['¿Qué significa teatro en sentido arquitectónico?','Lugar para apreciar el acto escénico','Texto escrito','Conflicto dramático','Personaje','La dimensión arquitectónica se refiere al lugar destinado a la representación.'],
['¿Qué es el acto escénico?','Montaje o puesta en escena de un texto dramatúrgico','Un vestuario','Una acotación','Un ensayo escrito','Es la realización escénica de una obra.'],
['¿Qué es la dramaturgia?','Obra teatral escrita que desarrolla una narrativa','Diseño de luces','Venta de entradas','Distribución de butacas','Contiene la narrativa, parlamentos y acotaciones.'],
['¿Qué es un parlamento?','Intervención hablada de un personaje','Cambio de iluminación','Vestuario','Escenografía','El parlamento corresponde a lo que dice el personaje.'],
['¿Qué es una didascalia?','Indicación o acotación de la obra','Protagonista','Espectador','Taquilla','Las didascalias indican acciones y otros aspectos de la representación.'],
['¿Qué figura dialogó con integrantes del coro en el origen griego del teatro?','Tespis','Molière','Brecht','Shakespeare','Tespis aparece asociado a la ruptura de la estructura coral mediante el diálogo.'],
['¿Cuál es un elemento teatral?','Utilería','Boletín de notas','Matrícula','Examen','La utilería comprende objetos usados en escena.'],
['¿Qué es el escenario?','Espacio delimitado donde ocurre la acción dramática','Solo el maquillaje','Únicamente la música','El argumento escrito','El escenario es el espacio físico, simbólico y performativo de la representación.'],
['¿Qué es la escenografía?','Diseño y disposición del entorno escénico','Pronunciación','Recuerdo emocional','Diálogo del coro','Establece ambiente y contexto y transforma el espacio.'],
['¿Qué es un personaje teatral?','Entidad ficticia construida por texto e interpretación','Persona que vende entradas','Director de luces','Público','Posee voluntad, cuerpo, voz e intencionalidad dentro de la ficción.'],
['¿Qué función cumple el antagonista?','Se opone al protagonista','Siempre narra','Siempre es malvado','Diseña vestuario','Su función es la oposición dramática; no implica necesariamente maldad.'],
['¿Qué es el objetivo de un personaje?','Aquello que desea conseguir','El telón','La duración del descanso','La entrada del público','El objetivo orienta las acciones del personaje.'],
['¿Qué es un obstáculo dramático?','Aquello que dificulta lograr el objetivo','Un aplauso','El título de la obra','Una butaca','El obstáculo impide o dificulta el logro del objetivo y alimenta el conflicto.'],
['¿Qué es el conflicto?','Motor de tensión que impulsa la historia','Solo la última escena','La iluminación','El vestuario','Los obstáculos y enfrentamientos impulsan la acción dramática.'],
['¿Qué es el clímax?','Momento de máxima intensidad del conflicto','Presentación del elenco','Ensayo inicial','Diseño del afiche','Es el punto de inflexión en el que se enfrenta el mayor desafío.'],
['¿Para qué sirve el guion?','Organizar diálogos e indicaciones de la representación','Reemplazar al actor','Eliminar el conflicto','Vender entradas','Es un mapa de ruta para actores, dirección y técnicos.'],
['¿Qué hace el director?','Guía actores e integra interpretación y elementos técnicos','Solo compra entradas','Actúa todos los papeles','Solo escribe críticas','Interpreta el guion y coordina el trabajo escénico.'],
['¿Con qué se vinculan los orígenes del teatro?','Ritos y escenificación','Televisión digital','Cine sonoro','Redes sociales','La evolución histórica estudiada parte de rituales y primeras representaciones.'],
['¿Qué etapa sigue al teatro griego en la secuencia histórica estudiada?','Teatro romano','Teatro inmersivo','Teatro contemporáneo','Teatro moderno','La secuencia pasa de Grecia a Roma.'],
['¿Con qué contexto se relaciona especialmente el teatro medieval?','Religioso','Cine digital','Publicidad','Realidad virtual','Las representaciones medievales se vinculan con relatos y contextos religiosos.'],
['¿Qué caracteriza la referencia al Renacimiento teatral?','Recuperación de referentes clásicos','Invención del cine','Desaparición de actores','Supresión del texto','El Renacimiento retoma referentes de la Antigüedad clásica.'],
['¿Cuál es la secuencia histórica correcta?','Grecia, Roma, Edad Media, Renacimiento','Roma, Renacimiento, Grecia, Edad Media','Renacimiento, Grecia, Roma, Edad Media','Edad Media, Roma, Renacimiento, Grecia','Respeta el orden temporal de las etapas.'],
['¿Qué distingue la función teatral frente a una toma cinematográfica?','Sucede en vivo y cada función es irrepetible','Siempre se repite idéntica','No requiere público','Se edita después','El teatro se construye en tiempo real ante espectadores.'],
['¿Cuáles son los instrumentos esenciales del actor?','Cuerpo, voz y mente','Taquilla, afiche y luces','Butacas, telón y entradas','Cámara, trípode y micrófono','El cuerpo, la voz y la mente sostienen la interpretación.'],
['¿Cuál es una cualidad esencial del actor?','Observación','Desatención','Impuntualidad','Rigidez obligatoria','La observación nutre la construcción de conductas y personajes.'],
['¿Qué sostiene la concentración del actor?','Atención a escena, compañeros y circunstancias','Distracción constante','Olvido deliberado','Ausencia de escucha','Permite mantenerse disponible durante la acción escénica.'],
['¿Qué plantea el «como si»?','Actuar considerando verdaderas las circunstancias imaginadas','Imitar sin comprender','Gritar siempre','Ignorar objetivos','La imaginación y lógica interna ayudan a construir verdad escénica.'],
['¿Qué aporta la historia personal del personaje?','Comprender motivaciones y experiencias pasadas','Determinar la taquilla','Elegir butacas','Eliminar relaciones','Los antecedentes explican deseos y comportamientos.'],
['¿Qué significa escuchar en escena?','Responder a lo que realmente ocurre entre actores','Esperar sin atender el turno','Repetir mecánicamente','Interrumpir siempre','La actuación colaborativa requiere escucha activa.'],
['¿Qué es la expresión corporal?','Uso del cuerpo para comunicar y crear','Solo hablar fuerte','Solo leer el guion','Solo elegir luces','El cuerpo transmite emociones y mensajes con o sin palabras.'],
['¿Qué estudia la kinesia o corporalidad?','Movimientos, posturas y gestos','Distancias entre espectadores','Precio de entradas','Historia del teatro','Los movimientos corporales transmiten estados y mensajes.'],
['¿Qué estudia la proxemia?','Uso del espacio y distancias','Pronunciación de vocales','Vestuario histórico','Argumento escrito','La distancia escénica puede comunicar poder, afecto o conflicto.'],
['¿Qué es el tono muscular?','Grado de tensión o relajación corporal','Altura de la voz','Cantidad de luces','Velocidad del texto','La tensión muscular varía con las emociones y la acción.'],
['¿Qué implica el eje y alineación?','Postura, centro de gravedad y equilibrio','Solo memorizar','Cambiar el guion','Subir volumen','Favorece equilibrio, movimiento y presencia escénica.'],
['¿Qué es el tono vocal?','Altura grave o aguda','Intensidad sonora','Distancia escénica','Velocidad de pasos','El tono se refiere a la altura de la voz.'],
['¿Qué es el volumen vocal?','Intensidad de la voz','Altura tonal','Gesto corporal','Acotación','El volumen corresponde a la intensidad sonora.'],
['¿Qué es el ritmo vocal?','Velocidad y cadencia del habla','Diseño de escenografía','Tensión muscular','Color de luces','El ritmo organiza velocidad, cadencia y pausas.'],
['¿Qué es la entonación?','Variación melódica que expresa sentido','Solo hablar rápido','Distancia entre actores','Movimiento de manos','La entonación modifica la melodía de las frases.'],
['¿Qué es proyectar la voz?','Dirigirla con alcance sin confundirlo con gritar','Gritar necesariamente','Susurrar sin aire','Evitar respirar','La proyección depende del uso coordinado de aire, postura y resonancia.'],
['¿Qué permite la exhalación controlada?','Sostener frases y modular la voz','Eliminar pausas','Impedir articulación','Tensar siempre la garganta','El flujo de aire controlado favorece claridad y sostenimiento.'],
['¿Qué es la dicción?','Pronunciación clara y correcta','Diseño de vestuario','Distancia escénica','Improvisación sin escucha','Permite que el público comprenda cada palabra.'],
['¿Qué es la articulación?','Formación precisa de sonidos','Volumen exclusivamente','Maquillaje','Iluminación','Intervienen labios, lengua y mandíbula al producir sonidos.'],
['¿Qué aporta la respiración diafragmática al actor?','Control y sostenimiento de la voz','Obligación de gritar','Ausencia de pausas','Pérdida de claridad','Favorece una emisión sostenida y con menos esfuerzo.'],
['¿Qué principio rige la improvisación?','Aceptar propuestas y no negar','Rechazar todas las ideas','Evitar escuchar','Detener la escena ante errores','Aceptar y construir con las propuestas sostiene la escena.'],
['¿Qué debe definirse para improvisar una situación?','Argumento, espacio y situación','Solo vestuario','Solo música','Solo título','Estos elementos orientan la construcción de la improvisación.'],
['¿Qué estructura narrativa se propone para improvisar?','Inicio, desarrollo y final','Final, final e inicio','Solo clímax','Sin acontecimientos','La improvisación puede crearse espontáneamente con estructura.'],
['¿Cuáles son las cuatro dimensiones de creación del personaje?','Física, social, psicológica y espiritual','Tono, ritmo, volumen y aire','Guion, luces, taquilla y música','Inicio, nudo, final y aplauso','El análisis cuatridimensional examina cuerpo, entorno, mundo interno y creencias.'],
['¿Qué se estudia en el aspecto social del personaje?','Relaciones, ocupación y entorno','Solo color de ojos','Solo volumen','Solo postura','Incluye familia, educación, trabajo, posición social y relaciones.'],
['¿Qué se estudia en el aspecto psicológico del personaje?','Motivaciones, valores y conflictos internos','Solo mobiliario','Solo vestuario','Solo luces','Examina ambiciones, temperamento, actitudes y mundo interior.']
];const Q=raw.map((r,i)=>({q:r[0],o:r.slice(1,5),a:0,e:r[5]}));let answers=Array(50).fill(null),n=0,done=false;const app=document.getElementById('app');function render(){if(done){let score=answers.filter((a,i)=>a===Q[i].a).length;app.innerHTML=`<h2>Resultado: ${score}/50 · ${Math.round(score*100/50)}%</h2><p>Revisa tus respuestas. Los errores incluyen la respuesta correcta y una explicación.</p>`+Q.map((q,i)=>`<section class="review"><b>${i+1}. ${q.q}</b><p class="${answers[i]===q.a?'correct':'wrong'}">Tu respuesta: ${answers[i]===null?'Sin responder':q.o[answers[i]]} ${answers[i]===q.a?'✓':'✗'}</p>${answers[i]!==q.a?`<p><b>Respuesta correcta:</b> ${q.o[q.a]}</p><p><b>Explicación:</b> ${q.e}</p>`:''}</section>`).join('')+'<button class="primary" onclick="answers.fill(null);n=0;done=false;render();scrollTo(0,0)">Repetir examen</button>';return}let q=Q[n];app.innerHTML=`<small>Pregunta ${n+1} de 50 · Respondidas: ${answers.filter(x=>x!==null).length}</small><div class="bar"><div class="fill" style="width:${(n+1)*2}%"></div></div><h2>${n+1}. ${q.q}</h2>`+q.o.map((o,i)=>`<button class="option ${answers[n]===i?'selected':''}" onclick="answers[n]=${i};render()">${'ABCD'[i]}. ${o}</button>`).join('')+`<nav><button ${n===0?'disabled':''} onclick="n--;render()">Anterior</button>${n===49?'<button class="primary" onclick="done=true;render();scrollTo(0,0)">Finalizar y corregir</button>':'<button class="primary" onclick="n++;render()">Siguiente</button>'}</nav>`}render();</script></html>
