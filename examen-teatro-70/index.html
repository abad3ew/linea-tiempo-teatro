<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examen avanzado de Teatro · 70 preguntas</title><style>*{box-sizing:border-box}body{font:17px system-ui,sans-serif;background:#edf1f8;color:#192640;margin:0}.wrap{max-width:830px;margin:22px auto;padding:22px}header{background:linear-gradient(110deg,#152541,#563f9d);color:#fff;padding:26px;border-radius:20px}h1{margin:5px 0}main section{background:#fff;padding:24px;border-radius:18px;margin:18px 0;box-shadow:0 5px 22px #15254112}.pill{display:inline-block;border-radius:30px;background:#e9e2ff;color:#4c3289;padding:5px 11px;font-size:13px;font-weight:700}button{font:inherit;cursor:pointer;border-radius:11px;border:2px solid #dce2ed;padding:13px;background:white}button:focus-visible{outline:3px solid orange}.option{display:block;width:100%;text-align:left;margin:9px 0}.option.sel{background:#e6ddff;border-color:#6947c0}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.primary{background:#593cb2;color:#fff;border-color:#593cb2}.progress{background:#dce3ed;height:11px;border-radius:20px;overflow:hidden;margin-top:14px}.fill{background:#4ac5a5;height:100%}.review{border-left:5px solid #c35438;background:#fff5f0;padding:14px;margin:12px 0;border-radius:8px}.review.ok{border-color:#1a976e;background:#eafaf3}.muted{color:#55637a}.hide{display:none}@media(max-width:550px){.wrap{padding:10px}header,main section{padding:17px}}</style></head><body><div class="wrap"><header><span class="pill">Evaluación avanzada</span><h1>Examen de Teatro · 70 preguntas</h1><p>Preguntas de aplicación, comparación y alternativas cercanas. Al finalizar, revisa tus errores con respuestas correctas y explicaciones.</p><div id="status">Cargando preguntas…</div><div class="progress"><div class="fill" id="fill"></div></div></header><main><section id="exam"><span class="pill" id="topic"></span><h2 id="question"></h2><div id="options"></div><div class="actions"><button id="back">Anterior</button><button class="primary" id="next">Siguiente</button><button class="primary hide" id="end">Finalizar examen</button></div><p class="muted">Puedes regresar y cambiar tus respuestas antes de finalizar.</p></section><section id="result" class="hide"></section><section id="error" class="hide"></section></main></div><script>
const EXTRA=[
['Fundamentos','En una obra, el público observa a los intérpretes desde un recinto construido para esa finalidad. ¿Qué concepto nombra específicamente el recinto?',['Acto escénico','Teatro arquitectónico','Dramaturgia','Clímax'],1,'El sentido arquitectónico nombra el lugar destinado a apreciar la representación; el acto escénico es la puesta en escena.'],
['Fundamentos','Una indicación escrita dice «se aleja lentamente y cierra la puerta». ¿Qué clasificación corresponde?',['Parlamento porque es texto escrito','Conflicto porque hay una puerta','Didascalia porque orienta la acción','Guion porque contiene palabras'],2,'Una didascalia indica acciones o circunstancias; el parlamento es una intervención hablada del personaje.'],
['Fundamentos','El protagonista desea recuperar una carta, pero otro personaje la oculta. ¿Qué elemento se reconoce en la acción de ocultarla?',['Obstáculo que dificulta el objetivo','Clímax obligatorio','Escenografía','Parlamento'],0,'El objetivo es recuperar la carta y ocultarla impide alcanzarlo. El clímax no puede deducirse solo de este dato.'],
['Fundamentos','Dos personajes discuten desde el inicio. ¿Es correcto afirmar que esa primera discusión ya es el clímax?',['Sí, toda discusión es un clímax','Sí, si hablan fuerte','No, el clímax es siempre el final','No necesariamente: debe ser el punto de máxima intensidad del conflicto'],3,'El conflicto puede estar presente en varias escenas; el clímax es su momento crítico de máxima intensidad.'],
['Fundamentos','¿Qué afirmación distingue con mayor precisión escenario y escenografía?',['Ambos son exclusivamente objetos móviles','El escenario es el espacio de representación y la escenografía organiza su entorno visual','Escenografía significa solo edificio','Escenario significa parlamento'],1,'El escenario es un espacio físico, simbólico y performativo; la escenografía diseña y dispone el entorno.'],
['Fundamentos','Un actor descubre el pasado y los deseos del personaje antes de ensayar. ¿Qué está trabajando principalmente?',['Venta de entradas','Iluminación','Historia de fondo y motivaciones','Acústica de la sala'],2,'Los antecedentes explican experiencias y las motivaciones permiten comprender objetivos y comportamientos.'],
['Historia','¿Cuál de estas secuencias respeta el orden histórico trabajado?',['Grecia → Roma → Edad Media → Renacimiento','Roma → Grecia → Renacimiento → Edad Media','Edad Media → Grecia → Roma → Renacimiento','Renacimiento → Edad Media → Grecia → Roma'],0,'El recorrido histórico de la presentación sitúa Grecia antes de Roma, luego Edad Media y Renacimiento.'],
['Historia','Un estudiante dice que el teatro medieval y el contemporáneo se caracterizan exactamente por lo mismo. ¿Qué respuesta se ajusta al recorrido del curso?',['Sí, ambos pertenecen al mismo periodo','Sí, ninguno se vincula con su contexto','No, porque el medieval no tuvo representación','No: corresponden a periodos y contextos distintos'],3,'La evolución teatral estudia transformaciones entre etapas; no deben confundirse como si fueran equivalentes.'],
['Actor','Durante una función, un compañero cambia involuntariamente el ritmo de su intervención. ¿Qué respuesta demuestra escucha escénica?',['Ignorar lo ocurrido y actuar mecánicamente','Atender a lo sucedido y responder manteniendo la escena','Abandonar inmediatamente el personaje','Repetir la escena desde el inicio'],1,'Escuchar en escena es estar disponible a lo que sucede entre actores, no limitarse a esperar el turno memorizado.'],
['Actor','Un intérprete se pregunta cómo actuaría si las circunstancias ficticias fueran reales. ¿Qué noción utiliza?',['Proxemia','Didascalia','El «como si»','Escenografía'],2,'El «como si» de Stanislavski emplea imaginación y lógica interna para construir verdad escénica.'],
['Actor','¿Cuál de las siguientes asociaciones corresponde a los instrumentos del actor?',['Cuerpo: gesto; voz: ritmo; mente: concentración','Cuerpo: taquilla; voz: maquillaje; mente: luces','Cuerpo: texto; voz: escenografía; mente: utilería','Cuerpo: butacas; voz: telón; mente: afiche'],0,'El cuerpo comunica mediante movimiento y gesto, la voz mediante recursos sonoros y la mente sostiene concentración e imaginación.'],
['Expresión corporal','Dos personajes permanecen inmóviles, pero uno invade el espacio personal del otro. ¿Qué concepto explica principalmente el efecto de distancia?',['Articulación','Tono vocal','Didascalia','Proxemia'],3,'La proxemia estudia el uso del espacio y la distancia para comunicar relaciones como poder, afecto o conflicto.'],
['Expresión corporal','Un actor cambia de postura y endurece los hombros sin desplazarse. ¿Qué combinación describe mejor lo ocurrido?',['Solo ritmo vocal','Postura y tono muscular','Solo escenografía','Solo dramaturgia'],1,'La postura comunica mediante alineación corporal y el tono muscular corresponde al grado de tensión o relajación.'],
['Expresión vocal','Una actriz mantiene la misma intensidad, pero pasa de voz grave a aguda. ¿Qué modificó principalmente?',['Volumen','Proxemia','Tono','Dicción'],2,'Tono es altura vocal; volumen es intensidad. Cambiar de grave a agudo no implica necesariamente aumentar la intensidad.'],
['Expresión vocal','Un actor habla más despacio e introduce pausas sin cambiar la altura vocal. ¿Qué recurso varía?',['Ritmo','Tono','Maquillaje','Proxemia'],0,'El ritmo comprende velocidad y cadencia; la altura corresponde al tono.'],
['Técnica vocal','Una persona grita para alcanzar la última fila. ¿Qué principio del material está confundiendo?',['La dicción exige memorizar','La entonación es solo velocidad','El guion sustituye la respiración','La proyección no equivale a gritar'],3,'Proyectar significa dirigir la voz con alcance y control; gritar no es su definición.'],
['Técnica vocal','Una frase se oye fuerte pero varias consonantes son ininteligibles. ¿Qué aspecto conviene trabajar de manera más directa?',['Vestuario','Articulación y dicción','Proxemia','Historia del personaje'],1,'La intensidad no garantiza comprensión: articulación y dicción intervienen en la formación y pronunciación clara de las palabras.'],
['Improvisación','En una improvisación, alguien propone que hay una tormenta y su compañero responde «no existe ninguna tormenta» sin desarrollar otra acción. ¿Qué principio incumple?',['Alineación corporal','Proyección','Aceptar propuestas y no negar','Recuerdo emocional'],2,'La improvisación exige escuchar y construir sobre las propuestas para mantener la continuidad de la ficción.'],
['Improvisación','¿Cuál es la conclusión correcta sobre crear una escena sin ensayo previo?',['Puede ser espontánea y aun así organizarse con inicio, desarrollo y final','Carece necesariamente de argumento','Debe negar todas las propuestas','No necesita escuchar a los demás'],0,'La improvisación se crea en el momento, pero el profesor propone argumento, espacio, situación y estructura narrativa.'],
['Personaje','En una ficha se pregunta por salario, vivienda y condiciones de trabajo. ¿A qué dimensión corresponde principalmente?',['Física','Psicológica','Espiritual','Social'],3,'El aspecto social incluye ocupación, finanzas, vivienda, educación, familia y relaciones con el entorno.']
];
let Q=[],answers=[],pos=0;const $=x=>document.getElementById(x);function scramble(q,k){let order=[0,1,2,3];for(let j=3;j>0;j--){let r=(k*13+j*7+17)%(j+1);[order[j],order[r]]=[order[r],order[j]]}return {...q,options:order.map(i=>q.options[i]),answer:order.indexOf(q.answer)}}function show(){let q=Q[pos];$('topic').textContent=q.topic;$('question').textContent=(pos+1)+'. '+q.q;$('options').replaceChildren();q.options.forEach((text,i)=>{let b=document.createElement('button');b.className='option'+(answers[pos]===i?' sel':'');b.textContent='ABCD'[i]+'. '+text;b.setAttribute('aria-pressed',answers[pos]===i?'true':'false');b.onclick=()=>{answers[pos]=i;show()};$('options').append(b)});$('back').disabled=pos===0;$('next').classList.toggle('hide',pos===Q.length-1);$('end').classList.toggle('hide',pos!==Q.length-1);$('status').textContent=`Pregunta ${pos+1} de ${Q.length} · ${answers.filter(x=>x!==null).length} respondidas`;$('fill').style.width=(answers.filter(x=>x!==null).length/Q.length*100)+'%'}$('back').onclick=()=>{pos--;show();scrollTo(0,0)};$('next').onclick=()=>{pos++;show();scrollTo(0,0)};$('end').onclick=()=>{let missing=answers.filter(x=>x===null).length;if(missing&&!confirm(`Quedan ${missing} sin responder. ¿Finalizar?`))return;let score=Q.filter((q,i)=>answers[i]===q.answer).length;$('exam').classList.add('hide');$('result').classList.remove('hide');let r=$('result');r.replaceChildren();let h=document.createElement('h2');h.textContent=`Resultado: ${score}/${Q.length} · ${Math.round(score/Q.length*100)}%`;r.append(h);let p=document.createElement('p');p.textContent='Revisión completa: las respuestas equivocadas o en blanco muestran la alternativa correcta y una explicación.';r.append(p);Q.forEach((q,i)=>{let ok=answers[i]===q.answer;let d=document.createElement('div');d.className='review'+(ok?' ok':'');let a=document.createElement('h3');a.textContent=(i+1)+'. '+q.q+' — '+(ok?'Correcta':'Revisar');d.append(a);let b=document.createElement('p');b.textContent='Tu respuesta: '+(answers[i]===null?'Sin responder':q.options[answers[i]]);d.append(b);if(!ok){let c=document.createElement('p');c.textContent='Respuesta correcta: '+q.options[q.answer];let e=document.createElement('p');e.textContent='Explicación: '+q.explanation;d.append(c,e)}r.append(d)});let retry=document.createElement('button');retry.className='primary';retry.textContent='Repetir las 70 preguntas';retry.onclick=()=>{answers.fill(null);pos=0;r.classList.add('hide');$('exam').classList.remove('hide');show();scrollTo(0,0)};r.append(retry);scrollTo(0,0)};
(async()=>{try{let response=await fetch('../examen-teatro/index.html',{cache:'no-store'});if(!response.ok)throw Error('No se pudo recuperar el banco inicial');let html=await response.text();let match=html.match(/const raw=(\[[\s\S]*?\]);const Q=/);if(!match)throw Error('El banco inicial cambió de formato');let initial=Function('return '+match[1])();if(initial.length!==50)throw Error('El banco inicial no contiene 50 preguntas');Q=initial.map((x,i)=>({topic:['Fundamentos','Historia','Actor','Expresión corporal','Técnica vocal','Improvisación','Personaje'][Math.min(6,Math.floor(i/8))],q:x[0],options:x.slice(1,5),answer:0,explanation:x[5]})).concat(EXTRA.map(x=>({topic:x[0],q:x[1],options:x[2],answer:x[3],explanation:x[4]}))).map(scramble);if(Q.length!==70)throw Error('El examen no tiene 70 preguntas');answers=Array(Q.length).fill(null);show()}catch(e){$('exam').classList.add('hide');$('error').classList.remove('hide');$('error').textContent='No se pudo cargar el examen. Recarga esta página cuando GitHub Pages termine de actualizarse. Detalle: '+e.message;$('status').textContent='Carga pendiente'}})();
</script></body></html>
