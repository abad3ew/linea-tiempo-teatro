<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070804">
<title>Para Mariana</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{overflow:hidden;background:#070804;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
:root{--rx:-6deg;--ry:0deg;--mx:50%;--my:38%}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;perspective:1500px;overflow:hidden;background:
radial-gradient(circle at var(--mx) var(--my),rgba(255,217,92,.15),transparent 20%),
radial-gradient(circle at 50% 74%,rgba(112,88,16,.09),transparent 30%),
linear-gradient(180deg,#11130d 0%,#090a07 58%,#050603 100%)}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 45%,rgba(0,0,0,.58) 100%)}
.halo{position:absolute;width:min(46vw,520px);aspect-ratio:1;border-radius:50%;background:#f2cf43;filter:blur(105px);opacity:.08}
.title{position:absolute;z-index:30;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.title small{display:block;color:#8f896f;letter-spacing:.36em;text-transform:uppercase;font-size:.56rem;margin-bottom:7px}
.title h1{margin:0;font-family:Georgia,serif;font-weight:400;font-size:clamp(1.65rem,4vw,2.9rem);letter-spacing:-.04em;color:#fff8de}
.title em{color:#f5cc35;font-weight:400}
.scene{position:relative;width:min(90vw,560px);height:min(78vh,700px);transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .12s ease-out;will-change:transform;cursor:grab;animation:breathe 6.5s ease-in-out infinite}
.scene:active{cursor:grabbing}
.roseWrap{position:absolute;left:50%;top:47%;width:1px;height:1px;transform-style:preserve-3d}
.rose{position:absolute;width:320px;height:320px;margin:-160px;transform-style:preserve-3d;filter:drop-shadow(0 30px 30px rgba(0,0,0,.35));animation:bloom 1.4s cubic-bezier(.16,1,.3,1) both}
.core{position:absolute;left:50%;top:50%;width:1px;height:1px;transform-style:preserve-3d}
.petal{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin-left:calc(var(--pw)/-2);margin-top:calc(var(--ph)/-2);transform-origin:50% 88%;border-radius:51% 49% 47% 53% / 78% 76% 24% 22%;transform-style:preserve-3d;
background:
radial-gradient(circle at 36% 18%,rgba(255,255,255,.76),transparent 16%),
linear-gradient(150deg,#fff6a3 0%,#ffe76b 16%,#f4cf3c 40%,#dfa817 72%,#a96708 100%);
box-shadow:
inset 8px 4px 12px rgba(255,255,255,.26),
inset -12px -18px 22px rgba(98,53,0,.22),
0 2px 5px rgba(0,0,0,.14);
transform:rotateZ(var(--a)) rotateX(var(--curl)) rotateY(var(--yaw)) translateY(var(--r)) translateZ(var(--depth)) scale(var(--ps))}
.petal:before{content:"";position:absolute;left:12%;right:12%;top:3%;height:32%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.32),transparent);filter:blur(.8px)}
.petal:after{content:"";position:absolute;left:45%;bottom:4%;width:10%;height:56%;border-radius:50%;background:linear-gradient(180deg,transparent,rgba(90,49,0,.14));filter:blur(1px)}
.center{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:radial-gradient(circle at 46% 40%,#fff681 0 10%,#f0c52d 23%,#c98b10 46%,#765000 75%,#3b2500 100%);transform:translateZ(56px);box-shadow:0 0 28px rgba(255,211,56,.34)}
.stem{position:absolute;left:50%;top:50%;width:18px;height:390px;margin-left:-9px;transform:translate3d(0,135px,-44px) rotateX(5deg);border-radius:10px;background:linear-gradient(90deg,#10280d,#4d7d2a 36%,#79a74b 50%,#2c511b 72%,#0e210a);box-shadow:inset 2px 0 2px rgba(255,255,255,.12),8px 18px 24px rgba(0,0,0,.22)}
.leaf{position:absolute;left:50%;top:50%;width:125px;height:58px;border-radius:100% 0 100% 0;transform-style:preserve-3d;background:
linear-gradient(155deg,rgba(255,255,255,.14),transparent 28%),
linear-gradient(145deg,#1d4818,#4f7d2f 44%,#173814 80%);
box-shadow:inset 0 -8px 11px rgba(0,0,0,.25),0 12px 20px rgba(0,0,0,.18)}
.leaf:before{content:"";position:absolute;inset:5px 10px;border-radius:inherit;background:repeating-linear-gradient(30deg,transparent 0 10px,rgba(225,243,200,.08) 11px 12px)}
.leaf:after{content:"";position:absolute;left:8px;right:10px;top:50%;height:1px;background:rgba(218,240,190,.3);transform:rotate(-17deg)}
.leaf.one{transform:translate3d(-18px,195px,0) rotateZ(-34deg) rotateY(18deg) rotateX(8deg)}
.leaf.two{transform:translate3d(8px,245px,-10px) rotateZ(152deg) rotateY(-22deg) rotateX(-6deg) scale(.92)}
.shadow{position:absolute;left:50%;top:83%;width:min(55vw,420px);height:110px;transform:translateX(-50%) rotateX(78deg) translateZ(-120px);border-radius:50%;background:radial-gradient(ellipse,rgba(25,27,16,.85),rgba(10,11,7,.45) 55%,transparent 76%);filter:blur(6px)}
.message{position:absolute;z-index:30;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(90vw,520px);text-align:center;pointer-events:none}
.message p{margin:0;font-family:Georgia,serif;font-size:clamp(1rem,2.6vw,1.22rem);line-height:1.55;color:#e9e1c7}
.message strong{font-weight:400;color:#f4d15a}
.message span{display:block;margin-top:8px;color:#77715f;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#f7d960;box-shadow:0 0 12px #ffd74d;animation:float var(--d) ease-in-out infinite alternate;opacity:.28}
@keyframes bloom{0%{opacity:0;transform:scale(.15) rotateZ(-8deg)}100%{opacity:1;transform:scale(1) rotateZ(0)}}
@keyframes breathe{50%{translate:0 -5px}}
@keyframes float{to{transform:translate3d(var(--dx),-55px,50px);opacity:.72}}
@media(max-width:650px){.scene{transform:rotateX(calc(var(--rx) + 2deg)) rotateY(var(--ry)) scale(.82);height:72vh}.message{bottom:14px}.title{top:14px}}
@media(prefers-reduced-motion:reduce){.scene,.spark,.rose{animation:none!important}.scene{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="halo"></div>
  <div class="title"><small>una sola rosa para</small><h1><em>Mariana</em></h1></div>
  <div class="shadow"></div>
  <div class="scene" id="scene">
    <div class="roseWrap">
      <div class="stem"></div>
      <div class="leaf one"></div>
      <div class="leaf two"></div>
      <div class="rose"><div class="core" id="core"><div class="center"></div></div></div>
    </div>
  </div>
  <div class="message">
    <p>No todo lo importante necesita muchas palabras. <strong>A veces, una sola flor basta.</strong></p>
    <span>mueve la rosa con el dedo o el mouse</span>
  </div>
</div>
<script>
const core=document.getElementById('core');
const scene=document.getElementById('scene');
function petal(styles){
  const p=document.createElement('div');p.className='petal';
  for(const [k,v] of Object.entries(styles)) p.style.setProperty(k,v);
  core.insertBefore(p,core.firstChild);
}
const rings=[
  {n:6,r:5,w:52,h:86,c:-64,d:48,s:.62},
  {n:9,r:14,w:66,h:104,c:-50,d:38,s:.74},
  {n:12,r:28,w:80,h:122,c:-36,d:25,s:.86},
  {n:16,r:46,w:94,h:140,c:-22,d:12,s:.98},
  {n:20,r:64,w:108,h:154,c:-10,d:-2,s:1.08}
];
rings.forEach((ring,ri)=>{
  const offset=(ri%2)*9;
  for(let i=0;i<ring.n;i++){
    petal({
      '--a':((360/ring.n)*i+offset+(Math.random()-.5)*8)+'deg',
      '--r':(-ring.r)+'px','--depth':ring.d+'px',
      '--curl':(ring.c+(Math.random()-.5)*7)+'deg',
      '--yaw':((Math.random()-.5)*8)+'deg',
      '--pw':(ring.w*(.97+Math.random()*.05))+'px',
      '--ph':(ring.h*(.97+Math.random()*.07))+'px',
      '--ps':ring.s*(.98+Math.random()*.04)
    });
  }
});
for(let i=0;i<18;i++){
  const s=document.createElement('i');s.className='spark';
  s.style.left=(10+Math.random()*80)+'%';s.style.top=(18+Math.random()*60)+'%';
  s.style.setProperty('--d',(3+Math.random()*4)+'s');
  s.style.setProperty('--dx',((Math.random()-.5)*70)+'px');
  scene.appendChild(s);
}
let rx=-6,ry=0,drag=false,lastX=0,lastY=0;
function apply(){
  document.documentElement.style.setProperty('--rx',rx+'deg');
  document.documentElement.style.setProperty('--ry',ry+'deg');
  document.documentElement.style.setProperty('--mx',(50+ry*.8)+'%');
  document.documentElement.style.setProperty('--my',(38-rx*.35)+'%');
}
scene.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;scene.setPointerCapture(e.pointerId)});
scene.addEventListener('pointermove',e=>{
  if(drag){
    ry+=(e.clientX-lastX)*.12;rx-=(e.clientY-lastY)*.08;
    ry=Math.max(-24,Math.min(24,ry));rx=Math.max(-16,Math.min(8,rx));
    lastX=e.clientX;lastY=e.clientY;apply();
  }else if(e.pointerType==='mouse'){
    const r=scene.getBoundingClientRect();
    ry=((e.clientX-r.left)/r.width-.5)*18;
    rx=-6-((e.clientY-r.top)/r.height-.5)*10;
    apply();
  }
});
scene.addEventListener('pointerup',e=>{drag=false;scene.releasePointerCapture(e.pointerId)});
scene.addEventListener('pointercancel',()=>drag=false);
scene.addEventListener('dblclick',()=>{rx=-6;ry=0;apply()});
</script>
</body>
</html>
