<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080906">
<title>Para Mariana · Rosas 3D</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#080906;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
:root{--rx:-8deg;--ry:0deg}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;perspective:1300px;overflow:hidden;background:
radial-gradient(circle at 50% 32%,rgba(245,201,49,.16),transparent 22%),
radial-gradient(circle at 50% 74%,rgba(127,92,11,.14),transparent 28%),
linear-gradient(180deg,#12140e 0%,#090a07 55%,#040503 100%)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,#000,transparent 70%);opacity:.25}
.glow{position:absolute;width:min(65vw,760px);aspect-ratio:1;border-radius:50%;background:#f0c82c;filter:blur(120px);opacity:.07;pointer-events:none}
.title{position:absolute;z-index:20;top:max(24px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.title small{display:block;color:#b8ad82;letter-spacing:.34em;text-transform:uppercase;font-size:.58rem;margin-bottom:6px}
.title h1{margin:0;font-family:Georgia,serif;font-size:clamp(1.7rem,4vw,3rem);font-weight:400;letter-spacing:-.035em;color:#fff9df}.title em{color:#f4cb31;font-weight:400}
.hint{position:absolute;z-index:20;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:.63rem;letter-spacing:.18em;text-transform:uppercase;color:#8d876d;white-space:nowrap;pointer-events:none}
.scene{position:relative;width:min(92vw,720px);height:min(78vh,760px);transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0);transition:transform .12s ease-out;will-change:transform;cursor:grab}.scene:active{cursor:grabbing}
.bouquet{position:absolute;left:50%;top:48%;width:1px;height:1px;transform-style:preserve-3d}
.rose{position:absolute;width:190px;height:190px;margin:-95px;transform-style:preserve-3d;transform:translate3d(var(--x),var(--y),var(--z)) scale(var(--s)) rotateX(var(--tiltx)) rotateY(var(--tilty)) rotateZ(var(--tiltz));filter:drop-shadow(0 22px 18px rgba(0,0,0,.32));animation:bloom 1.2s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--delay)}
.rose-core{position:absolute;left:50%;top:50%;width:1px;height:1px;transform-style:preserve-3d}
.petal{position:absolute;left:50%;top:50%;width:var(--pw);height:var(--ph);margin-left:calc(var(--pw)/-2);margin-top:calc(var(--ph)/-2);transform-origin:50% 88%;transform-style:preserve-3d;border-radius:52% 48% 50% 50% / 72% 72% 28% 28%;
background:
radial-gradient(circle at 38% 22%,rgba(255,255,255,.72),transparent 17%),
linear-gradient(145deg,#fff07a 0%,#f8d43b 28%,#e9b91e 64%,#bf8510 100%);
box-shadow:
inset 7px 3px 10px rgba(255,255,255,.24),
inset -8px -14px 18px rgba(112,66,0,.18),
0 1px 3px rgba(0,0,0,.12);
backface-visibility:visible;
transform:rotateZ(var(--a)) rotateX(var(--curl)) translateY(var(--r)) translateZ(var(--depth)) scale(var(--ps));
}
.petal:after{content:"";position:absolute;inset:4px 10px 34%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.34),transparent);filter:blur(1px);opacity:.8}
.center{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:radial-gradient(circle at 48% 44%,#ffe861 0 16%,#e7ae12 38%,#855100 72%);transform:translateZ(42px);box-shadow:0 0 18px rgba(255,208,43,.34)}
.stem{position:absolute;left:50%;top:50%;width:15px;height:300px;margin-left:-7px;transform-origin:50% 0;transform:translate3d(var(--x),var(--y),calc(var(--z) - 34px)) rotateZ(var(--stemrot)) rotateX(9deg);border-radius:10px;background:linear-gradient(90deg,#17370f,#5d8a35 42%,#284817 72%,#10270d);box-shadow:inset 2px 0 2px rgba(255,255,255,.13),8px 20px 28px rgba(0,0,0,.2)}
.leaf{position:absolute;left:50%;top:50%;width:92px;height:44px;transform-style:preserve-3d;transform:translate3d(var(--x),var(--y),var(--z)) rotateZ(var(--rz)) rotateY(var(--ry2));border-radius:100% 0 100% 0;background:
linear-gradient(155deg,rgba(255,255,255,.18),transparent 30%),
linear-gradient(145deg,#234f1c,#4e7a2e 44%,#173712 78%);
box-shadow:inset 0 -6px 9px rgba(0,0,0,.22),0 12px 20px rgba(0,0,0,.18);transform-origin:0 50%}
.leaf:after{content:"";position:absolute;left:6px;right:7px;top:50%;height:1px;background:rgba(215,238,183,.32);transform:rotate(-18deg)}
.wrap{position:absolute;left:50%;top:68%;width:390px;height:330px;margin-left:-195px;transform:translateZ(-95px);clip-path:polygon(11% 0,50% 15%,89% 0,78% 100%,22% 100%);background:linear-gradient(120deg,rgba(255,247,214,.95),rgba(210,174,94,.88) 46%,rgba(247,226,167,.96));filter:drop-shadow(0 28px 25px rgba(0,0,0,.35));opacity:.9}
.wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(95deg,transparent 25%,rgba(255,255,255,.35) 36%,transparent 49%,rgba(110,69,8,.12) 68%,transparent)}
.ribbon{position:absolute;left:50%;top:79%;width:300px;height:72px;margin-left:-150px;transform:translateZ(75px);border-radius:50%;background:linear-gradient(180deg,#e8bf39,#ab7710);box-shadow:0 10px 20px rgba(0,0,0,.28),inset 0 5px 8px rgba(255,255,255,.2)}
.ribbon:before,.ribbon:after{content:"";position:absolute;top:28px;width:155px;height:115px;background:linear-gradient(140deg,#d9aa24,#8e5c08);clip-path:polygon(0 0,100% 18%,72% 100%,42% 68%,0 95%);z-index:-1}
.ribbon:before{right:51%;transform:rotate(12deg)}.ribbon:after{left:51%;transform:scaleX(-1) rotate(12deg)}
.tag{position:absolute;left:50%;top:83%;transform:translate3d(-50%,0,130px) rotateZ(-4deg);padding:10px 18px;border-radius:7px;background:#f5edd4;color:#6a5015;font-family:Georgia,serif;font-style:italic;font-size:1.05rem;box-shadow:0 10px 22px rgba(0,0,0,.26)}
.floor{position:absolute;left:50%;top:80%;width:min(75vw,620px);height:150px;transform:translateX(-50%) rotateX(77deg) translateZ(-120px);border-radius:50%;background:radial-gradient(ellipse,#1a1c12 0,#0b0c08 56%,transparent 74%);filter:blur(5px)}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#f8dc67;box-shadow:0 0 12px #ffd74d;animation:float var(--d) ease-in-out infinite alternate;opacity:.45}
@keyframes bloom{0%{opacity:0;transform:translate3d(var(--x),calc(var(--y) + 70px),var(--z)) scale(.05) rotateZ(22deg)}100%{opacity:1;transform:translate3d(var(--x),var(--y),var(--z)) scale(var(--s)) rotateX(var(--tiltx)) rotateY(var(--tilty)) rotateZ(var(--tiltz))}}
@keyframes float{to{transform:translate3d(var(--dx),-60px,60px);opacity:.9}}
@media(max-width:650px){.scene{width:100vw;height:74vh;transform:rotateX(calc(var(--rx) + 3deg)) rotateY(var(--ry)) scale(.78)}.title{top:18px}.hint{bottom:12px}.tag{top:84%}}
@media(prefers-reduced-motion:reduce){.rose,.spark{animation:none!important}.scene{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="title"><small>un detalle para</small><h1><em>Mariana</em></h1></div>
  <div class="floor"></div>
  <div class="scene" id="scene">
    <div class="bouquet" id="bouquet">
      <div class="wrap"></div>
      <div class="ribbon"></div>
      <div class="tag">Para Mariana</div>
    </div>
  </div>
  <div class="hint">mueve el ramo · arrastra con el dedo</div>
</div>
<script>
const bouquet=document.getElementById('bouquet');
const scene=document.getElementById('scene');

const roses=[
[-170,-170,-10,.82,-8,12,-16],
[-60,-215,65,.93,-7,-8,7],
[65,-210,100,1.0,-4,9,-4],
[170,-160,5,.83,-10,-13,15],
[-205,-65,35,.88,-3,18,-9],
[-92,-78,145,1.08,-5,-4,8],
[35,-95,185,1.12,-3,6,-5],
[150,-62,95,.97,-7,-10,10],
[-145,25,65,.92,-10,10,-8],
[-28,12,205,1.16,-2,-2,2],
[102,18,125,1.02,-6,8,8],
[-72,105,82,.86,-9,-7,-6],
[58,102,52,.84,-8,10,7]
];

function el(cls,styles={}){const n=document.createElement('div');n.className=cls;for(const[k,v]of Object.entries(styles))n.style.setProperty(k,v);return n}

function makeRose([x,y,z,s,tx,ty,tz],i){
  const stem=el('stem',{'--x':x+'px','--y':(y+55)+'px','--z':z+'px','--stemrot':(x*.035)+'deg'});
  bouquet.appendChild(stem);
  const rose=el('rose',{'--x':x+'px','--y':y+'px','--z':z+'px','--s':s,'--tiltx':tx+'deg','--tilty':ty+'deg','--tiltz':tz+'deg','--delay':(i*70)+'ms'});
  const core=el('rose-core');
  const rings=[
    {n:5,r:4,w:42,h:70,c:-55,d:34,s:.66},
    {n:8,r:12,w:54,h:86,c:-40,d:25,s:.77},
    {n:11,r:24,w:66,h:100,c:-27,d:15,s:.88},
    {n:14,r:38,w:78,h:112,c:-16,d:5,s:1},
    {n:17,r:53,w:88,h:122,c:-7,d:-6,s:1.08}
  ];
  rings.forEach((ring,ri)=>{
    const offset=(ri%2)*10;
    for(let j=0;j<ring.n;j++){
      const jitter=(Math.random()-.5)*9;
      const p=el('petal',{
        '--a':((360/ring.n)*j+offset+jitter)+'deg',
        '--r':(-ring.r)+'px',
        '--depth':ring.d+'px',
        '--curl':(ring.c+(Math.random()-.5)*9)+'deg',
        '--pw':ring.w+'px','--ph':ring.h+'px','--ps':ring.s
      });
      core.appendChild(p);
    }
  });
  core.appendChild(el('center'));
  rose.appendChild(core);
  bouquet.appendChild(rose);
}

function makeLeaf(x,y,z,rz,ry){
  bouquet.appendChild(el('leaf',{'--x':x+'px','--y':y+'px','--z':z+'px','--rz':rz+'deg','--ry2':ry+'deg'}));
}
roses.forEach(makeRose);
[
[-250,-90,-10,-42,10],[210,-100,-15,26,-15],[-230,10,20,-20,25],[205,20,40,150,30],
[-185,115,-15,-15,-25],[150,120,-10,165,18],[-110,155,5,-40,15],[95,158,10,205,-18],
[-15,165,28,-82,12]
].forEach(v=>makeLeaf(...v));

for(let i=0;i<28;i++){
  const s=el('spark',{'left':(6+Math.random()*88)+'%','top':(15+Math.random()*70)+'%','--d':(2.5+Math.random()*4)+'s','--dx':((Math.random()-.5)*80)+'px'});
  scene.appendChild(s);
}

let targetX=-8,targetY=0,drag=false,lastX=0,lastY=0;
function apply(){document.documentElement.style.setProperty('--rx',targetX+'deg');document.documentElement.style.setProperty('--ry',targetY+'deg')}
function point(x,y){
  const r=scene.getBoundingClientRect();
  targetY=((x-r.left)/r.width-.5)*24;
  targetX=-8-((y-r.top)/r.height-.5)*12;
  apply();
}
scene.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;scene.setPointerCapture(e.pointerId)});
scene.addEventListener('pointermove',e=>{
  if(drag){targetY+=(e.clientX-lastX)*.12;targetX-=(e.clientY-lastY)*.08;targetY=Math.max(-28,Math.min(28,targetY));targetX=Math.max(-20,Math.min(10,targetX));lastX=e.clientX;lastY=e.clientY;apply()}
  else if(e.pointerType==='mouse') point(e.clientX,e.clientY);
});
scene.addEventListener('pointerup',e=>{drag=false;scene.releasePointerCapture(e.pointerId)});
scene.addEventListener('pointercancel',()=>drag=false);
window.addEventListener('deviceorientation',e=>{
  if(e.gamma==null||innerWidth>700)return;
  targetY=Math.max(-18,Math.min(18,e.gamma*.45));
  targetX=-8+Math.max(-8,Math.min(8,(e.beta-45)*.12));
  apply();
});
</script>
</body>
</html>
