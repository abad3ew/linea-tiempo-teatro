<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historia y evolución del teatro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="wrap"><span class="eyebrow">LÍNEA DE TIEMPO INTERACTIVA</span><h1>Historia y evolución del teatro</h1><p>Del rito a la experiencia inmersiva</p><div class="controls"><input id="search" type="search" placeholder="Buscar: Grecia, Molière, Chéjov…"><select id="periodFilter"><option value="all">Todos los períodos</option></select></div></div></header>
